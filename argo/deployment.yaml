apiVersion: apps/v1
kind: Deployment
metadata:
  name: deployment # The name of the Kubernetes Deployment
  labels:
    app: react-app
spec:
  replicas: 1 # The number of pods to be created
  selector:
    matchLabels:
      app: react-app
  template:
    metadata:
      labels:
        app: react-app
    spec:
      containers:
      - name: react-app # Name of the container
        image: uditmishra/react-app:13
        imagePullPolicy: Always # Ensure Kubernetes pulls the latest image from Docker Hub
        ports:
        - containerPort: 3000 # Port exposed by the container

---
apiVersion: v1
kind: Service
metadata:
  name: react-app-service
spec:
  selector:
    app: react-app
  ports:
    - protocol: TCP
      port: 80       # Exposed service port
      targetPort: 3000 # Matches the container port
      nodePort: 30080  # External port (only for NodePort type)
  type: NodePort

